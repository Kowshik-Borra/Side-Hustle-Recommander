{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form class="form-panel" method="POST">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" placeholder="e.g. Keerthi Sri">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" required placeholder="3-20 characters, letters/numbers/_">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="At least 8 chars, 1 letter, 1 number">

    <button type="submit">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
